name: Render reels

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours (UTC)
  workflow_dispatch:          # "Run workflow" button for manual runs

concurrency:
  group: render-reels
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Download fonts (Outfit, JetBrains Mono)
        run: |
          mkdir -p fonts
          curl -sSfL -o fonts/Outfit.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/outfit/Outfit%5Bwght%5D.ttf"
          curl -sSfL -o fonts/JetBrainsMono.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"

      - name: Render and upload
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL || 'https://industrious-viral-story-snap.base44.app' }}
          RENDER_KEY: ${{ secrets.RENDER_KEY }}
          MAX_RENDERS: "2"
        run: python render.py

      # Viral Studios (a separate app): multi-part series, one episode per video,
      # with a slow zoom and pan on the pictures. Runs even if the step above
      # failed, and never affects it. Waits quietly until its address and key are set.
      - name: Render Viral Studios episodes
        if: always()
        env:
          APP_URL: ${{ vars.STUDIOS_APP_URL }}
          RENDER_KEY: ${{ secrets.STUDIOS_RENDER_KEY }}
          MAX_RENDERS: "6"
        run: |
          if [ -z "$APP_URL" ] || [ -z "$RENDER_KEY" ]; then
            echo "Viral Studios is not set up yet (STUDIOS_APP_URL variable and STUDIOS_RENDER_KEY secret). Skipping."
            exit 0
          fi
          python render.py
