name: Voice samples

# Records each Kokoro voice reading one line, saved on the "voice-samples" branch.
on:
  workflow_dispatch:
    inputs:
      voices:
        description: "Voices or blend recipes, space separated (blank = the default set)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kokoro
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q "kokoro>=0.9.4" soundfile
      - name: Record
        run: python voice_samples.py ${{ inputs.voices }}
      - name: Save to the voice-samples branch
        run: |
          git config user.name "preview-bot"
          git config user.email "preview-bot@users.noreply.github.com"
          git checkout --orphan voice-samples
          git rm -rq --cached . || true
          git add -f previews/voices/*.mp3
          git commit -qm "Voice samples"
          git push -f origin voice-samples
